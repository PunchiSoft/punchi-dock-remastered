name: Documentation improvement
description: Report missing, unclear, or incorrect documentation for Punchi Dock Remastered.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for README sections, guides, tooltips, and other project
        documentation. Do not paste personal file paths, usernames, tokens, or
        private file contents.
  - type: input
    id: location
    attributes:
      label: Document or section
      description: Name the file, section, tooltip, or link that needs a change.
      placeholder: README.md, Installation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Describe the confusing, outdated, or incomplete part.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Explain what the documentation should say or show instead.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add links, screenshots, or references and remove private information first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
