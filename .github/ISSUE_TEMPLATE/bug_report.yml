name: Bug report
description: Report a reproducible problem with Punchi Dock Remastered.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Punchi Dock Remastered is under active development toward 1.0, and the
        latest published package can lag behind the source tree. Read the README
        compatibility notes before reporting.

        Do not paste personal file paths, usernames, tokens, or private file
        contents. Do not report security vulnerabilities in public issues;
        contact the maintainer privately.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the dock with ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: dock-version
    attributes:
      label: Punchi Dock version
      description: Use the version shown in the widget settings, in `metadata.json`, or in the release asset name.
      placeholder: 0.9.7.84
    validations:
      required: true
  - type: dropdown
    id: package-origin
    attributes:
      label: Package origin
      description: Choose how Punchi Dock was installed.
      options:
        - Prebuilt package from GitHub Releases
        - Distribution package
        - Built and installed from source
        - Development checkout
        - Not sure
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and version
      placeholder: Fedora 44
    validations:
      required: true
  - type: input
    id: plasma
    attributes:
      label: KDE Plasma and KWin versions
      description: "Run this command and paste its output: `plasmashell --version; kwin_wayland --version 2>/dev/null || kwin_x11 --version`."
      placeholder: Plasma 6.x, KWin 6.x
    validations:
      required: true
  - type: input
    id: qt
    attributes:
      label: Qt version
      description: Include the output of `qtpaths6 --qt-version`.
      placeholder: Qt 6.x
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      options:
        - Wayland
        - X11
        - Other
    validations:
      required: true
  - type: dropdown
    id: placement
    attributes:
      label: Dock placement
      options:
        - Floating dock
        - Inside a Plasma panel
        - Other
        - Not sure
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### How to capture Plasma logs

        On the supported distributions (Fedora, Debian, Kubuntu, Arch Linux, and openSUSE), Plasma runs as a systemd user service, so the command is the same. Reproduce the problem and paste the output below.

        To save the current session log:

        ```bash
        journalctl --user -b -u plasma-plasmashell.service --no-pager > plasmashell.log
        ```

        To watch the log while reproducing the problem:

        ```bash
        journalctl --user -b -f -u plasma-plasmashell.service
        ```

        If the service is not available, filter the session log instead:

        ```bash
        journalctl --user -b | grep -iE 'plasmashell|punchi'
        ```

        Remove personal paths, usernames, and private data before pasting.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the output captured with the commands above, and remove personal paths, usernames, and private data first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or additional context
      description: Drag screenshots or recordings here and remove private information first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the README compatibility notes.
          required: true
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
